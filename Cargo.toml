[workspace]
resolver = "2"
members = [
    "crates/lc_core",
    "crates/lc_render",
    "crates/lc_client_script",
    "crates/lc_game",
    "crates/lc_server",
    "crates/lc_client",
]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
# Local workspace crates
lc_core = { path = "crates/lc_core" }
lc_render = { path = "crates/lc_render" }
lc_client_script = { path = "crates/lc_client_script" }
lc_game = { path = "crates/lc_game" }

# Crates.io Public Bases (v0.2.0)
game_net = "0.2.0"
game_server = "0.2.0"
game_script = "0.2.0"

# External dependencies
macroquad = "0.4.16"
quad-net = "0.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
steel-core = { version = "0.8.3" }
tokio-tungstenite = "0.24"
futures-util = "0.3"
getrandom = { version = "0.2.17", features = ["custom"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
