name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish to (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'
        type: string

permissions:
  contents: write

jobs:
  build-wasm:
    name: Build WebAssembly Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM client
        run: |
          cargo build --release --target wasm32-unknown-unknown --bin client
          cp target/wasm32-unknown-unknown/release/client.wasm web/client.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-wasm
          path: web/client.wasm
          if-no-files-found: error

  build-and-package:
    name: Build Binary (${{ matrix.target }})
    needs: build-wasm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: lispcraft-linux-x86_64
            archive_ext: tar.gz
            exe_suffix: ""

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: lispcraft-macos-arm64
            archive_ext: tar.gz
            exe_suffix: ""

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: lispcraft-windows-x86_64
            archive_ext: zip
            exe_suffix: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download WebAssembly artifact
        uses: actions/download-artifact@v4
        with:
          name: client-wasm
          path: web

      - name: Build binaries
        run: |
          cargo build --release --target ${{ matrix.target }} --bins

      - name: Package release bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          DIST_DIR="${{ matrix.artifact_name }}"
          mkdir -p "$DIST_DIR"
          cp "target/${{ matrix.target }}/release/server" "$DIST_DIR/"
          cp "target/${{ matrix.target }}/release/client" "$DIST_DIR/"
          cp -r games "$DIST_DIR/"
          cp -r web "$DIST_DIR/"
          cp README.md "$DIST_DIR/"
          tar -czvf "${{ matrix.artifact_name }}.tar.gz" "$DIST_DIR"

      - name: Package release bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          DIST_DIR="${{ matrix.artifact_name }}"
          mkdir -p "$DIST_DIR"
          cp "target/${{ matrix.target }}/release/server.exe" "$DIST_DIR/"
          cp "target/${{ matrix.target }}/release/client.exe" "$DIST_DIR/"
          cp -r games "$DIST_DIR/"
          cp -r web "$DIST_DIR/"
          cp README.md "$DIST_DIR/"
          7z a "${{ matrix.artifact_name }}.zip" "$DIST_DIR"

      - name: Upload packaged archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  publish-release:
    name: Publish Release to GitHub
    needs: [build-wasm, build-and-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release packages
        uses: actions/download-artifact@v4
        with:
          pattern: lispcraft-*
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v0.1.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: List artifacts to release
        run: |
          echo "Publishing release with tag: ${{ steps.vars.outputs.tag }}"
          ls -lh dist/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
